<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!--
  D-Bus 系统总线策略(org.fdebm)
  部署: cp 到 /usr/share/dbus-1/system.d/org.fdebm.conf

  - 允许 root(守护进程运行用户)持有 org.fdebm 名称
  - 允许任意用户向该名称发送方法调用(授权本身由 Polkit 把关);
    信号广播与接收 dbus 默认放行
-->
<busconfig>
  <policy user="root">
    <allow own="org.fdebm"/>
  </policy>

  <policy context="default">
    <allow send_destination="org.fdebm"/>
    <allow send_destination="org.fdebm" send_interface="org.freedesktop.DBus.Introspectable"/>
    <allow send_destination="org.fdebm" send_interface="org.freedesktop.DBus.Peer"/>
    <allow send_destination="org.fdebm" send_interface="org.freedesktop.DBus.Properties"/>
    <allow receive_sender="org.fdebm"/>
  </policy>
</busconfig>
